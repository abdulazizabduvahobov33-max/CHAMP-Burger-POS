services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose — only the `backend` service (on the same
    # compose network) needs to reach Postgres. Use `docker compose exec postgres psql ...`
    # for a shell, or temporarily add a `ports:` mapping if you need external DB access.

  backend:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Overrides whatever DATABASE_URL is in server/.env — inside compose, Postgres is
      # reachable at the service name `postgres`, never `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/src/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Not published to the host — the frontend container's nginx proxies /api and /uploads
    # to it over the compose network (see client/nginx.conf). Add a `ports:` mapping only
    # for local debugging (e.g. hitting the API directly without going through nginx).

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
