# Render Blueprint — deploys the backend, frontend, and database from this one file.
# Full click-by-click walkthrough: docs/RENDER_DEPLOY.md
#
# Two values are intentionally left blank below (`sync: false`) because they reference EACH
# OTHER's live Render URL, which only exists after both services have been created once:
#   - CLIENT_URL        (backend)  — the frontend's https://<...>.onrender.com URL
#   - VITE_API_URL       (frontend) — the backend's  https://<...>.onrender.com/api URL
# Fill them in after the first deploy (see docs/RENDER_DEPLOY.md), then redeploy each service.
# SEED_ADMIN_PASSWORD / SEED_SELLER_PASSWORD are also left blank on purpose — set your own
# real values rather than reusing the demo defaults from .env.example on a public deployment.

databases:
  - name: champ-pos-db
    databaseName: champ_pos
    user: champ_pos
    plan: free

services:
  - type: web
    name: champ-pos-backend
    env: node
    plan: free
    rootDir: server
    # `--include=dev` is required: NODE_ENV=production (set below/at build time) makes a
    # plain `npm install` skip devDependencies — which is where typescript, @types/node,
    # @types/express, prisma (CLI), vite, tailwindcss, etc. all live. Without this flag the
    # build either can't find `tsc`/`vite` at all, or (worse, and what actually happened)
    # partially resolves and fails with "could not find declaration file" for express/node.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: champ-pos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: SEED_ADMIN_LOGIN
        value: admin
      - key: SEED_ADMIN_NAME
        value: Super Admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SELLER_LOGIN
        value: seller
      - key: SEED_SELLER_NAME
        value: Продавец
      - key: SEED_SELLER_PASSWORD
        sync: false

  - type: web
    name: champ-pos-frontend
    env: static
    rootDir: client
    # `--include=dev` is required here too — vite, typescript, tailwindcss, and the @types/*
    # packages this build needs are all devDependencies (see the backend service above for
    # why a plain `npm install` would skip them on Render).
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
