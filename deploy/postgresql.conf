# Production-oriented Postgres settings for KRUNCH POS, sized for a small VPS (~2 vCPU /
# 2–4 GB RAM — the typical budget tier this app targets). Mounted into the `postgres`
# container in docker-compose.yml. If your VPS has significantly more RAM, the two sizing
# rules of thumb are: shared_buffers ≈ 25% of RAM, effective_cache_size ≈ 50–75% of RAM.

# ── Memory ───────────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# ── Connections ──────────────────────────────────────────────
# One backend Node process with Prisma's default pool (≈ num CPUs * 2 + 1) comfortably
# fits well under this; headroom is for `psql`/pgAdmin/backup jobs running alongside it.
max_connections = 50

# ── Write-ahead log / durability ─────────────────────────────
# A POS system's data (sales, stock) is worth more than the small write-latency cost of
# full fsync durability — do not weaken synchronous_commit/fsync for a "small speedup".
wal_compression = on
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# ── Query planner ────────────────────────────────────────────
# Assumes SSD-backed VPS storage (true for essentially every modern provider) — the default
# of 4.0 assumes spinning disks and makes the planner avoid index scans more than it should.
random_page_cost = 1.1

# ── Logging (kept minimal — container stdout is already captured by Docker/journald) ──
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
