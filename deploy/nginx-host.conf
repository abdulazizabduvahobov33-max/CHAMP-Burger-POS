# Host-level nginx — sits in front of the Docker Compose stack (see docker-compose.yml)
# and does ONLY two jobs: TLS termination and reverse-proxying to the `frontend` container's
# published port. The frontend container's own nginx (client/nginx.conf) does the actual
# SPA routing + /api and /uploads proxying to `backend` — this file does not duplicate that.
#
# Install: copy to /etc/nginx/sites-available/champ-pos, symlink into sites-enabled, then
# run certbot (see docs/DEPLOYMENT.md, "Как подключить SSL"). Certbot rewrites the `listen
# 443` block and adds the ssl_certificate lines automatically — the version below is the
# pre-certbot HTTP-only starting point plus a commented HTTPS block as a reference for what
# certbot will produce, in case you ever need to reconstruct it by hand.

server {
    listen 80;
    listen [::]:80;
    server_name champpos.example.com;

    # Let's Encrypt HTTP-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS once a certificate exists. Before the first
    # `certbot --nginx` run, comment this out and uncomment the proxy_pass block below
    # instead, so the site is reachable over plain HTTP while you request the cert.
    location / {
        return 301 https://$host$request_uri;
    }

    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

