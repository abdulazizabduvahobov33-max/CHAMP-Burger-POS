gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed build assets (filename changes on every content change) — safe to cache
    # forever; a new deploy ships new filenames, so stale cache is never served.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /splash/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # App shell, manifest and service worker must always be revalidated — these are exactly
    # the files that tell the browser a new version exists, so caching them defeats the PWA
    # update flow (users would get stuck on an old build until a hard-refresh).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA routing: any path that isn't a real static file falls back to index.html so
    # react-router can handle it client-side (e.g. a hard refresh on /admin/warehouse).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — same origin as the frontend, so the browser never deals with CORS and
    # the refresh-token cookie (scoped to /api/auth) works without cross-site cookie rules.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product photos / company logo, served directly by the backend (see server/src/app.ts).
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
