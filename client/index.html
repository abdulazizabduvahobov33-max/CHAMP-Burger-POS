    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CHAMP Burger — POS</title>
    <!--
      Applied synchronously, before React mounts — otherwise the page would flash the default
      dark theme for a frame even when the visitor has light saved, since React effects only
      run after first paint. Kept intentionally tiny and framework-free.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem("champ-theme");
        var theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
